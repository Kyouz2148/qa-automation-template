name: Performance — k6 Load Tests

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'k6 scenario file'
        required: true
        default: 'tasks-load.k6.js'
        type: choice
        options:
          - api-smoke.k6.js
          - tasks-load.k6.js
      profile:
        description: 'Load profile'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike
  pull_request:
    types: [labeled]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read
  pull-requests: write

jobs:
  k6-load-test:
    name: k6 Load Suite (${{ inputs.profile || 'smoke' }})
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-load-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Start Demo App (if enabled)
        if: ${{ (vars.USE_DEMO_APP || 'true') == 'true' }}
        run: |
          node demo-app/server.mjs &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/api/health > /dev/null; then
              echo "Demo app is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Demo app failed to start"
          exit 1

      - name: Run k6 Scenario
        env:
          API_URL: ${{ vars.API_URL || 'http://127.0.0.1:4173' }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'qa.engineer@example.com' }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'Password123!' }}
          K6_PROFILE: ${{ inputs.profile || 'smoke' }}
        run: |
          mkdir -p reports
          k6 run "k6/scenarios/${{ inputs.scenario || 'tasks-load.k6.js' }}"

      - name: Publish k6 Summary to Job Summary
        if: ${{ !cancelled() && hashFiles('reports/k6-summary.md') != '' }}
        run: cat reports/k6-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload k6 Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-report
          path: reports/k6-summary.*
          retention-days: 14

      - name: Comment k6 Summary on PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('reports/k6-summary.md') != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- k6-load-report -->';
            const body = `${marker}\n${fs.readFileSync('reports/k6-summary.md', 'utf8')}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
