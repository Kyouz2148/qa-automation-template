name: New Test Scenario / Coverage Gap
description: Request or document a missing automated test scenario (Web, API, or Load)
title: '[Test Gap]: '
labels: ['qa', 'test-coverage']
body:
  - type: dropdown
    id: layer
    attributes:
      label: Test Layer
      options:
        - Web E2E (Playwright)
        - API / Contract (Playwright + Zod)
        - Accessibility (Axe)
        - Load / Performance (k6)
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Scenario & Acceptance Criteria
      placeholder: Given / When / Then or endpoint behavior to validate
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Risk / Priority
      options:
        - Critical (Smoke / Blocker)
        - High
        - Medium
        - Low
    validations:
      required: true
